name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug in CriteriaGuard.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first.
        If this is a security issue, please consult [SECURITY.md](https://github.com/Saksham-official/CriteriaGuard/blob/main/SECURITY.md) instead of creating a public issue.
  - type: input
    id: environment
    attributes:
      label: Environment Mode
      description: Did this occur in Mock Mode (`MOCK_LLM=true`) or Production Mode?
      placeholder: "e.g. Mock Mode (MOCK_LLM=true, USE_SAMPLE_DATA=true) on Windows 11"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run `python main.py` with MOCK_LLM=true
        2. Call GET `/api/tenders/upload` with sample PDF
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Tracebacks
      description: Paste any relevant terminal output or browser console logs here.
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Contributor Checklist
      options:
        - label: I verified this issue can be reproduced with the latest code on `main`.
          required: true
        - label: I confirmed this does not contain private API keys or confidential procurement records.
          required: true
